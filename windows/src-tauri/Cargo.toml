[package]
name = "tamanotchi"
version = "0.1.0"
description = "Tamanotchi – din lilla kollega på skärmen"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Windows egen TLS (schannel): inga C-beroenden, och följer Windows certifikat och proxy
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
