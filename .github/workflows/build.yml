name: Bygg Tamanotchi

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Ändringar i bara dokumentation eller varumärke bygger inte om appen
    paths-ignore: ["**.md", "brand/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Ett bygge i taget: annars kan två byggen tävla om releasen "latest"
# och lämna den som ett opublicerat utkast (då ger nedladdningslänken 404)
concurrency:
  group: tamanotchi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift-version
        run: swift --version

      - name: Bygg och paketera
        env:
          TAMANOTCHI_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
        run: ./scripts/package.sh

      - name: Packa ihop nedladdningen
        run: |
          mkdir -p dist/Tamanotchi
          cp -R build/Tamanotchi.app dist/Tamanotchi/
          cp scripts/install.sh scripts/uninstall.sh scripts/merge-hooks.js dist/Tamanotchi/
          cp README.md dist/Tamanotchi/LÄSMIG.md
          cd dist && ditto -c -k --keepParent Tamanotchi Tamanotchi-macOS.zip
          # Samma fil under det gamla namnet, så att gamla uppdateringsraden fortsätter fungera
          cp -R Tamanotchi Notchi && ditto -c -k --keepParent Notchi Notchi-macOS.zip

      - name: Ladda upp som bygg-artefakt
        uses: actions/upload-artifact@v5
        with:
          name: Tamanotchi-macOS
          path: dist/Tamanotchi-macOS.zip

      - name: Uppdatera "Senaste bygget" under Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automatiskt byggd från main ($(git rev-parse --short HEAD)). Packa upp och kör install.sh."
          if gh release view latest >/dev/null 2>&1; then
            # Finns redan (även som utkast): flytta taggen, byt fil, se till att den är publicerad
            git tag -f latest "$GITHUB_SHA"
            git push -f origin refs/tags/latest
            gh release upload latest dist/Tamanotchi-macOS.zip dist/Notchi-macOS.zip --clobber
            gh release edit latest --draft=false --prerelease --title "Senaste bygget" --notes "$NOTES" --tag latest
          else
            gh release create latest dist/Tamanotchi-macOS.zip dist/Notchi-macOS.zip --target "$GITHUB_SHA" \
              --title "Senaste bygget" --notes "$NOTES" --prerelease
          fi
          # Kontrollera att nedladdningen faktiskt fungerar
          sleep 5
          curl -fsSL -o /dev/null "https://github.com/${{ github.repository }}/releases/download/latest/Tamanotchi-macOS.zip"

      - name: Skapa versionsrelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Tamanotchi-macOS.zip --title "Tamanotchi ${{ github.ref_name }}" --generate-notes
